name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: python -m pip install --upgrade pip pytest flake8

    - name: Critical lint (syntax errors and undefined names)
      run: flake8 mcp-agentic-rules --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run test suite
      working-directory: mcp-agentic-rules
      run: pytest tests -q
